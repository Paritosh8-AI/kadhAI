name: Build Production Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Native Android Assets
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug & Release)
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kadhAI-installable-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kadhAI-production-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
